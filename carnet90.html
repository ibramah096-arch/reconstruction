<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 96px}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;line-height:1.2}
h1{font-size:26px}h2{font-size:21px;margin-bottom:8px}h3{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
:root[data-theme="dark"] .btn{color:#0b1516}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b1516}}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.arrow{background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:20px}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;min-height:48px}
.chk:last-child{border-bottom:0}
.box{flex:none;width:24px;height:24px;border:2px solid var(--mute);border-radius:7px;display:grid;place-items:center;font-size:15px;color:transparent;margin-top:1px}
.on .box{background:var(--acc);border-color:var(--acc);color:#fff}
.on .t{color:var(--mute);text-decoration:line-through}
.tag{font-size:13px;color:var(--mute)}
textarea,input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
textarea{min-height:70px;resize:vertical}
label{display:block;margin-top:12px;font-weight:600;font-size:15px}
.scale{display:flex;gap:6px;margin-top:6px}
.scale button{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:none}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .scale button.on{color:#0b1516}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scale button.on{color:#0b1516}}
.bar{height:10px;background:var(--c0);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:10px}
.grid button{aspect-ratio:1;border:0;border-radius:4px;padding:0;background:var(--c0)}
.grid .l1{background:var(--c1)}.grid .l2{background:var(--c2)}.grid .l3{background:var(--c3)}
.grid .now{outline:2px solid var(--warm);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center}.stat b{display:block;font:600 26px Newsreader,Georgia,serif}
.moods{display:flex;gap:4px;align-items:flex-end;height:64px;margin-top:8px}
.moods i{flex:1;background:var(--c3);border-radius:4px 4px 0 0;min-height:3px}
.hb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.hb span:first-child{width:46%}.hb .bar{flex:1}
.banner{background:var(--accs);border-radius:12px;padding:12px;margin:12px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fgrid label{margin-top:4px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:12px;color:var(--mute);min-height:56px}
nav button.on{color:var(--acc);font-weight:700}
nav button span{display:block;font-size:20px}
@media(min-width:640px){nav{left:50%;transform:translateX(-50%);width:640px}}
</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* 1) Collez ici la configuration de votre projet Firebase (voir GUIDE.md) */
const firebaseConfig={apiKey:"AIzaSyBwIIKhgc5MSrMxYMKbBxNhRfGq5EMU2tk",authDomain:"reconstruction-90.firebaseapp.com",projectId:"reconstruction-90",storageBucket:"reconstruction-90.firebasestorage.app",messagingSenderId:"767191696598",appId:"1:767191696598:web:51bd789d8441a3ac8a3577"};
const H=[["Respiration ou méditation, 10 min","Mental"],["Coucher avant 23 h 30","Mental"],["Marche ou sport, 20 min","Corps"],["Un échange vrai avec un proche","Relations"],["Aucune publication impulsive","Discrétion"],["Dépenses du jour notées","Finances"],["Journal du soir","Mental"]];
const DOM=["Mental","Relations","Discrétion","Finances"];
const TOP=["Revenir à soi","Observer sans se juger","Retrouver un rythme","Bouger pour se sentir mieux","Nommer ses émotions","Choisir une priorité","Faire le premier bilan","Faire le point sur ses forces","Clarifier ses dépenses","Protéger son attention","Ranger un espace","Recontacter une personne sûre","Repérer une pensée répétitive","Prendre une vraie pause","Écrire ses valeurs","Définir une limite","Faire une démarche professionnelle","Lister ses compétences","Reprendre un contact utile","Planifier la semaine","Bilan et ajustement","Réduire une source de stress","Identifier ses déclencheurs","Pratiquer la réponse différée","Faire une activité agréable","Évaluer son cercle relationnel","Mettre à jour son budget","Bilan et ajustement","Choisir une priorité financière","Faire un petit pas commercial","Revoir ses habitudes","Faire le point sur le mois","Célébrer un progrès discret","Préparer le mois suivant","Bilan et ajustement"];
const POOL=["Prendre soin de mon énergie","Clarifier un fait et une interprétation","Entretenir un lien fiable","Faire une action professionnelle utile","Réviser mes dépenses","Pratiquer une limite saine","Faire un bilan sans me juger","Préparer le lendemain","Apprendre quelque chose d’utile","Réduire une distraction","Reconnaître un progrès","Organiser une tâche reportée","Prendre l’air et bouger","Faire le point sur mes objectifs"];
const topic=n=>n<=TOP.length?TOP[n-1]:POOL[(n-TOP.length-1)%POOL.length];
const QUOTES=["Je n’ai pas besoin de tout régler aujourd’hui. Je dois seulement faire le prochain pas utile.","Ma valeur ne dépend pas de l’attention que les autres me donnent.","La discrétion protège ma paix ; elle ne m’oblige pas à m’isoler.","Je construis ma stabilité par des actions simples et répétées."];
const RQ=["Ai-je pris soin de mon équilibre mental et physique ?","Ai-je évité de réagir sous le coup de la colère ?","Ai-je entretenu un lien sain sans m’isoler ?","Ai-je respecté ma discrétion sur les réseaux ?","Ai-je accompli une action financière ou professionnelle concrète ?"];
const RULES_E=["Je distingue les faits de mes interprétations avant de conclure sur les intentions de quelqu’un.","Je n’utilise pas les publications pour envoyer des messages indirects ou provoquer des regrets.","Je ne prête ni ne dépense d’argent essentiel pour garder l’affection ou l’approbation d’une personne.","Je reste discret en ligne sans couper les liens humains fiables.","Je privilégie la régularité plutôt que la perfection."];
const RULES_F=["Je protège d’abord les dépenses essentielles et une réserve adaptée à ma situation.","Je vérifie les fournisseurs, les biens, les commissions et les justificatifs avant d’engager de l’argent.","Je teste petit avant d’investir davantage, surtout dans une activité gérée à distance.","Je sépare l’argent personnel et l’argent de l’activité dans mes notes."];
const W=[
["Faire le point","Stabiliser",["Écrire ce qui s’est passé et ce que je veux dans 90 jours","Choisir 3 personnes de confiance et leur écrire","Lister tous mes comptes et passer les profils en privé","Lister revenus, dettes et dépenses fixes"]],
["Installer la routine","Stabiliser",["Fixer une routine matin et soir, écrite","Dire à un proche de quoi j’ai besoin","Couper les notifications des réseaux","Ouvrir un budget minimal : essentiel / confort"]],
["Alléger le bruit","Stabiliser",["Repérer mes 3 déclencheurs d’angoisse","Mettre en pause les relations qui drainent","Trier abonnements et contacts sur les réseaux","Supprimer 2 dépenses non essentielles"]],
["Premier bilan","Stabiliser",["Relire mon carnet et noter 3 progrès","Remercier une personne qui m’a soutenu","Vérifier confidentialité et anciennes publications","Fixer un montant d’épargne de sécurité"]],
["Comprendre mes schémas","Reconstruire",["Identifier un schéma qui se répète","Dire non une fois, calmement","Définir ce que je partage ou non en ligne","Rassembler les papiers administratifs"]],
["Réparer ou clore","Reconstruire",["Écrire une lettre que je n’enverrai pas","Avoir une conversation difficile, ou y renoncer en conscience","Appliquer la règle des 24 h avant de répondre en ligne","Établir un plan de remboursement des dettes"]],
["Reprendre le contrôle","Reconstruire",["Garder une activité qui me fait du bien chaque jour","Planifier 2 moments sociaux simples","Renforcer mots de passe et double authentification","Automatiser un virement d’épargne"]],
["Se rendre solide","Reconstruire",["Lister mes forces et mes valeurs","Poser une limite claire avec quelqu’un","Choisir ma vitrine publique : professionnelle seulement ?","Trouver une source de revenu ou une économie de plus"]],
["Bilan mi-parcours","Reconstruire",["Comparer ma situation avec la semaine 1","Remercier ou renouer avec une personne clé","Auditer ce qu’on trouve sur moi en ligne","Réviser mon budget avec les vrais chiffres"]],
["Projeter","Ancrer",["Écrire ma vision à un an","Proposer une sortie ou un projet à un proche","Écrire mes règles durables pour les réseaux","Fixer 3 objectifs financiers à 12 mois"]],
["Rayonner avec discernement","Ancrer",["Relever un petit défi qui me fait peur","Trouver un mentor ou un groupe","Publier seulement ce qui sert mon projet","Constituer ou renforcer le fonds d’urgence"]],
["Sécuriser","Ancrer",["Préparer un plan pour les mauvais jours","Dire à mes proches ce qui m’a aidé","Faire un dernier nettoyage numérique","Vérifier que tout est automatisé et lisible"]],
["Bilan final et suite","Ancrer",["Relire les 90 jours et m’écrire une lettre","Fêter avec les personnes qui ont compté","Choisir les règles de discrétion à garder","Définir le plan financier des 90 jours suivants"]]
];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fresh=()=>({start:iso(new Date()),days:{},weeks:{},acts:{},money:{},notes:{},tx:[],fc:{}});
let S=fresh(),ACC=null,AMODE="in",AERR="";
let UID=null,timer=null,AOK="";
function save(){if(!UID)return;try{localStorage.setItem("r90:"+UID,JSON.stringify(S))}catch(e){}clearTimeout(timer);timer=setTimeout(()=>setDoc(doc(db,"users",UID),{data:JSON.stringify(S),updated:Date.now()}).catch(()=>{}),800)}
const dOf=n=>{const d=new Date(S.start+"T12:00:00");d.setDate(d.getDate()+n-1);return d};
const key=n=>iso(dOf(n));
const todayN=()=>Math.round((new Date(iso(new Date())+"T12:00:00")-new Date(S.start+"T12:00:00"))/864e5)+1;
const clamp=n=>Math.max(1,Math.min(90,n));
const wkOf=n=>Math.min(13,Math.floor((n-1)/7)+1);
const get=n=>S.days[key(n)]||{};
function setD(n,k,v){const q=key(n);(S.days[q]=S.days[q]||{})[k]=v;save()}
const comp=n=>(get(n).h||[]).filter(Boolean).length;
const wdays=w=>{const a=[];for(let n=(w-1)*7+1;n<=Math.min(w*7,90);n++)a.push(n);return a};
const fmt=(d,o)=>d.toLocaleDateString("fr-FR",o);
const TX=()=>S.tx||(S.tx=[]);
const todayIso=()=>iso(new Date());
const CO=["Alimentation","Transport","Logement","Communication","Santé","Famille","Loisirs","Activité / business","Autre"];
const CI=["Salaire","Activité / business","Aide reçue","Autre"];
const spend=n=>(parseFloat(get(n).sp)||0)+TX().filter(x=>x.t==="out"&&x.d===key(n)).reduce((a,x)=>a+x.a,0);
function rng(p){const t=new Date(),td=iso(t);if(p==="d")return[td,td];if(p==="w"){const a=new Date(t),b=new Date(t);a.setDate(t.getDate()-((t.getDay()+6)%7));b.setDate(a.getDate()+6);return[iso(a),iso(b)]}if(p==="m")return[td.slice(0,8)+"01",td.slice(0,8)+"31"];return["0000","9999"]}
function sums(p){const[a,b]=rng(p);let i=0,o=0;const by={};TX().forEach(x=>{if(x.d>=a&&x.d<=b){if(x.t==="in")i+=x.a;else{o+=x.a;by[x.c]=(by[x.c]||0)+x.a}}});return{in:i,out:o,by}}
const mS=()=>sums("m");
function keepForm(){const g=id=>document.getElementById(id);if(g("fa"))U.fx={a:g("fa").value,c:g("fc").value,n:g("fn").value,d:g("fd").value}}
const F=n=>Math.round(n).toLocaleString("fr-FR")+" FCFA";
function calcFin(){const M=S.money||{},r=document.getElementById("ffree");if(r)r.textContent=F((+M.cash||0)-(+M.reserve||0))}
function exportTxt(){const L=["MA RECONSTRUCTION — 90 JOURS",""];for(let n=1;n<=90;n++){const g=get(n);if(g.in||g.win||g.les||g.gra||g.m)L.push("Jour "+n+" — "+topic(n)+"\nIntention : "+(g.in||"")+"\nHumeur : "+(g.m||"")+"/5\nVictoire : "+(g.win||"")+"\nÀ retenir : "+(g.les||"")+"\nReconnaissance : "+(g.gra||""),"")}const N=S.notes||{};L.push("CARNET PRIVÉ","Valeurs : "+(N.principles||""),"Limites : "+(N.boundaries||""),"Soutien : "+(N.support||""),"Vision à 6 mois : "+(N.future||""));const u=URL.createObjectURL(new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="ma-reconstruction-carnet.txt";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const U={tab:"day",n:clamp(todayN()),w:wkOf(clamp(todayN())),arm:false,msg:""};

function acts(w){return W[w-1][2].map((t,i)=>{const k="w"+w+"-"+i,on=S.acts[k];return `<button class="chk ${on?"on":""}" data-a="act" data-k="${k}"><span class="box">✓</span><span><span class="t">${t}</span><br><span class="tag">${DOM[i]}</span></span></button>`}).join("")}

function day(){const n=U.n,w=wkOf(n),g=get(n),h=g.h||[],t=todayN();
const sun=t>=1&&t<=90&&dOf(t).getDay()===0;
return `<div class="row sp"><button class="arrow" data-a="dn" data-v="-1" aria-label="Jour précédent">‹</button>
<div style="text-align:center"><h1>Jour ${n} sur 90</h1><div class="mute">${fmt(dOf(n),{weekday:"long",day:"numeric",month:"long"})}${n===t?" · aujourd’hui":""}</div></div>
<button class="arrow" data-a="dn" data-v="1" aria-label="Jour suivant">›</button></div>
<div class="mute" style="text-align:center;margin-top:4px">Semaine ${w} : ${W[w-1][0]} (${W[w-1][1]})</div>
<div style="text-align:center;margin-top:6px"><b>Thème du jour : ${topic(n)}</b></div>
${sun&&n===t?`<div class="banner"><b>C’est dimanche.</b> Prenez 10 minutes pour votre bilan de la semaine.<br><button class="btn" style="margin-top:8px" data-a="gosun" data-v="${w}">Faire mon bilan</button></div>`:""}
<div class="card"><h3>Mon intention du jour</h3><input type="text" data-f="in" placeholder="Aujourd’hui, je veux surtout…" value="${esc(g.in)}"></div>
<div class="card"><div class="row sp"><h3>Habitudes</h3><span class="mute">${comp(n)} sur ${H.length}</span></div>
${H.map((x,i)=>`<button class="chk ${h[i]?"on":""}" data-a="hab" data-v="${i}"><span class="box">✓</span><span><span class="t">${x[0]}</span><br><span class="tag">${x[1]}</span></span></button>`).join("")}</div>
<div class="card"><h3>Actions de la semaine</h3>${acts(w)}</div>
<div class="card"><h3>Comment je me sens</h3>
<label>Humeur (1 bas, 5 haut)</label><div class="scale">${[1,2,3,4,5].map(v=>`<button class="${g.m===v?"on":""}" data-a="m" data-v="${v}">${v}</button>`).join("")}</div>
<label>Énergie</label><div class="scale">${[1,2,3,4,5].map(v=>`<button class="${g.e===v?"on":""}" data-a="e" data-v="${v}">${v}</button>`).join("")}</div>
<label>Dépenses du jour</label><div class="row sp" style="margin-top:6px"><b>${F(spend(n))}${(S.fc&&+S.fc.dout)?" / "+F(+S.fc.dout)+" prévus":""}</b><button class="ghost" data-a="gofin">Ajouter dans Finance</button></div></div>
<div class="card"><h3>Carnet du soir</h3>
<label>Une victoire, même petite</label><textarea data-f="win">${esc(g.win)}</textarea>
<label>Ce que j’ai appris ou ce qui a été dur</label><textarea data-f="les">${esc(g.les)}</textarea>
<label>Pour quoi je suis reconnaissant</label><textarea data-f="gra">${esc(g.gra)}</textarea></div>
<div class="card" style="border-left:3px solid var(--warm);font-weight:600">${QUOTES[Math.floor((n-1)/7)%4]}</div>`}

function board(){const t=Math.max(0,Math.min(90,todayN())),w=wkOf(Math.max(1,t||1));
let st=0;for(let n=t;n>=1&&comp(n)>=5;n--)st++;
const from=Math.max(1,t-6);let sum=0,c=0;for(let n=from;n<=t;n++){sum+=comp(n)/H.length;c++}
const avg=c?Math.round(100*sum/c):0;
const wsp=wdays(w).reduce((a,n)=>a+spend(n),0);let tsp=0;for(let n=1;n<=90;n++)tsp+=spend(n);
const done=[0,1,2,3].filter(i=>S.acts["w"+w+"-"+i]).length;
const cells=[...Array(90)].map((_,i)=>{const n=i+1,r=comp(n)/H.length,l=r>=.7?3:r>=.4?2:r>0?1:0;return `<button class="l${l} ${n===t?"now":""}" data-a="goday" data-v="${n}" aria-label="Jour ${n}"></button>`}).join("");
const m=[];for(let n=Math.max(1,t-13);n<=t;n++)m.push(get(n).m||0);
const rev=Object.keys(S.weeks).map(Number).filter(k=>S.weeks[k].sc).sort((a,b)=>b-a)[0];
return `<h1>Tableau de pilotage</h1><div class="mute">${t<1?"Le projet commence le "+fmt(dOf(1),{day:"numeric",month:"long"}):"Jour "+t+" sur 90"}</div>
<div class="card"><div class="bar"><i style="width:${Math.round(t/.9)}%"></i></div>
<div class="grid">${cells}</div><div class="mute" style="margin-top:8px">Chaque case est un jour : plus elle est foncée, plus vous avez tenu vos habitudes. Touchez-en une pour l’ouvrir.</div></div>
<div class="card stats"><div class="stat"><b>${st}</b><span class="mute">jours solides d’affilée</span></div><div class="stat"><b>${avg} %</b><span class="mute">habitudes sur 7 jours</span></div><div class="stat"><b>${done}/4</b><span class="mute">actions de la semaine</span></div></div>
<div class="card"><h3>Habitudes sur 7 jours</h3>${H.map((x,i)=>{let k=0,d=0;for(let n=from;n<=t;n++){d++;if((get(n).h||[])[i])k++}const p=d?Math.round(100*k/d):0;return `<div class="hb"><span>${x[0]}</span><div class="bar"><i style="width:${p}%"></i></div><span class="mute">${p} %</span></div>`}).join("")}</div>
<div class="card"><h3>Humeur des 14 derniers jours</h3><div class="moods">${m.map(v=>`<i style="height:${v*20}%;opacity:${v?1:.15}"></i>`).join("")||'<span class="mute">Pas encore de données.</span>'}</div></div>
<div class="card"><h3>Mes finances</h3><div class="mute">En FCFA. Notez des chiffres réels, même approximatifs. Un revenu espéré n’est pas de l’argent encaissé.</div>

function fcRes(){const C=S.fc||{};return [["d","Aujourd’hui"],["w","Cette semaine"],["m","Ce mois"]].map(([k,l])=>{const t=sums(k),pi=+C[k+"in"]||0,po=+C[k+"out"]||0;

const bar=(v,pv,over)=>`<div class="bar"><i style="width:${pv?Math.min(100,Math.round(100*v/pv)):0}%;${over?"background:#c0392b":""}"></i></div>`;

${pi?`<div class="mute" style="margin-top:6px">Revenus : ${F(t.in)} sur ${F(pi)} · ${t.in>=pi?"objectif atteint":"il manque "+F(pi-t.in)}</div>${bar(t.in,pi,false)}`:""}

<div class="stats" style="margin-top:12px"><div class="stat"><b style="font-size:19px">${s.in.toLocaleString("fr-FR")}</b><span class="mute">revenus</span></div><div class="stat"><b style="font-size:19px">${s.out.toLocaleString("fr-FR")}</b><span class="mute">dépenses</span></div><div class="stat"><b style="font-size:19px;color:${s.in-s.out<0?"#c0392b":"var(--acc)"}">${(s.in-s.out).toLocaleString("fr-FR")}</b><span class="mute">solde</span></div></div></div>

<div class="card"><h3>Opérations</h3>${list.length?list.map(x=>`<div class="row sp" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(x.n||x.c)}</b><div class="tag">${esc(x.c)} · ${fmt(new Date(x.d+"T12:00:00"),{day:"numeric",month:"short"})}</div></div><div class="row"><b style="color:${x.t==="in"?"var(--acc)":"var(--ink)"}">${x.t==="in"?"+":"−"}${x.a.toLocaleString("fr-FR")}</b><button class="ghost" data-a="txdel" data-v="${x.id}" aria-label="Supprimer">✕</button></div></div>`).join(""):'<span class="mute">Aucune opération sur cette période.</span>'}</div>`}

function settings(){return `<h1>Plus</h1>
<div class="card"><h3>Mon compte</h3><div class="mute">Connecté : ${esc(ACC)}</div><button class="ghost" style="margin-top:8px" data-a="out">Se déconnecter</button></div>

${[["principles","Les valeurs que je veux respecter","Ex. respect, honnêteté, autonomie…"],["boundaries","Les limites que je veux poser","Ce que j’accepte et ce que je n’accepte plus…"],["support","Les personnes et ressources qui peuvent me soutenir","Personnes de confiance, professionnels, contacts utiles…"],["future","Ma vision dans 6 mois","À quoi voudrais-je que ma vie ressemble ?"]].map(x=>`<label>${x[1]}</label><textarea data-f="${x[0]}" data-s="p" placeholder="${x[2]}">${esc((S.notes||{})[x[0]])}</textarea>`).join("")}</div>

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,n=U.n;keepForm();
if(a==="amode"){AMODE=v;AERR="";renderAuth();return}
if(a==="out"){logout();return}
if(a==="forgot"){forgot();return}
else if(a==="tab"){U.tab=v;U.arm=false;window.scrollTo(0,0)}
else if(a==="dn"){U.n=clamp(n+ +v)}
else if(a==="hab"){const h=(get(n).h||[]).slice();while(h.length<H.length)h.push(false);h[+v]=!h[+v];setD(n,"h",h)}

else if(a==="goday"){U.n=+v;U.tab="day";window.scrollTo(0,0)}
else if(a==="gosun"){U.w=+v;U.tab="sun";window.scrollTo(0,0)}
else if(a==="wn"){U.w=Math.max(1,Math.min(13,U.w+ +v))}

else if(a==="fp"){U.fp=v}
else if(a==="gofin"){U.tab="fin";window.scrollTo(0,0)}
else if(a==="txadd"){const x=U.fx||{},amt=parseFloat(String(x.a).replace(",","."));if(!(amt>0)){U.fe="Saisissez un montant supérieur à zéro."}else{const t=U.ft||"out";TX().push({id:Date.now(),d:x.d||todayIso(),t,a:Math.round(amt),c:x.c||(t==="in"?CI[0]:CO[0]),n:(x.n||"").trim()});U.fx={};U.fe="";save()}}
else if(a==="txdel"){S.tx=TX().filter(x=>String(x.id)!==v);save()}
else if(a==="rq"){const r=S.weeks[U.w]=S.weeks[U.w]||{};r.q=r.q||[];r.q[+v]=!r.q[+v];save()}
else if(a==="txt"){exportTxt()}
else if(a==="sc"){const r=S.weeks[U.w]=S.weeks[U.w]||{};r.sc=r.sc||[0,0,0,0];r.sc[+b.dataset.i]=+v;save()}
else if(a==="copy"){const txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(()=>{U.msg="Sauvegarde copiée.";render()},()=>{U.msg="Copie impossible sur cet appareil.";render()})}catch(x){U.msg="Copie impossible sur cet appareil."}}
else if(a==="imp"){try{const o=JSON.parse($("#imp").value);if(!o.start||!o.days)throw 0;S=o;save();U.msg="Sauvegarde restaurée."}catch(x){U.msg="Texte invalide : collez la sauvegarde complète."}}
else if(a==="reset"){if(U.arm){S={start:iso(new Date()),days:{},weeks:{},acts:{}};save();U.arm=false;U.n=1;U.w=1}else U.arm=true}
render()});

if(e.target.dataset.s==="m"){S.money=S.money||{};S.money[f]=e.target.value;save();calcFin();return}
if(e.target.dataset.s==="p"){S.notes=S.notes||{};S.notes[f]=e.target.value;save();return}
if(e.target.dataset.s==="w"){const r=S.weeks[U.w]=S.weeks[U.w]||{};r[f]=e.target.value;save()}
else setD(U.n,f,e.target.value)});

const ERR={"auth/invalid-email":"Adresse e-mail invalide.","auth/email-already-in-use":"Un compte existe déjà avec cet e-mail. Connectez-vous.","auth/weak-password":"Mot de passe trop faible : 8 caractères minimum.","auth/invalid-credential":"E-mail ou mot de passe incorrect.","auth/wrong-password":"E-mail ou mot de passe incorrect.","auth/user-not-found":"E-mail ou mot de passe incorrect.","auth/too-many-requests":"Trop de tentatives. Réessayez dans quelques minutes.","auth/network-request-failed":"Pas de connexion internet."};

document.addEventListener("submit",async e=>{e.preventDefault();AOK="";

}catch(x){AERR=errMsg(x);renderAuth()}});
$("#app").innerHTML='<div class="mute" style="padding:25vh 0;text-align:center">Chargement…</div>';

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

<div style="background: #1e293b; color: #f8fafc; padding: 15px; border-radius: 12px; margin: 15px 0; font-family: sans-serif; text-align: center;">
  <h3 style="margin-top: 0; font-size: 15px; color: #38bdf8;">⏰ Mon Alarme Quotidienne</h3>
  <input type="time" id="customAlarmTime" style="padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; margin-bottom: 8px;">
  <br>
  <button onclick="saveCustomAlarm()" style="background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">Enregistrer l'alarme</button>
  <p id="alarmStatus" style="font-size: 11px; margin-top: 8px; color: #cbd5e1; font-style: italic;"></p>
</div>

<script>
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedTime = localStorage.getItem('userCustomAlarm');
    if (savedTime) {
      document.getElementById('customAlarmTime').value = savedTime;
      document.getElementById('alarmStatus').innerText = "✅ Alarme active pour : " + savedTime;
    } else {
      document.getElementById('alarmStatus').innerText = "⚠️ Aucune alarme configurée.";
    }
  });

  function saveCustomAlarm() {
    const timeInput = document.getElementById('customAlarmTime').value;
    if (!timeInput) {
      alert("Veuillez sélectionner une heure valide.");
      return;
    }
    localStorage.setItem('userCustomAlarm', timeInput);
    document.getElementById('alarmStatus').innerText = "✅ Alarme active pour : " + timeInput;
    alert("Alarme enregistrée pour " + timeInput + " !");
  }

  setInterval(() => {
    const savedTime = localStorage.getItem('userCustomAlarm');
    if (!savedTime) return;

    const maintenant = new Date();
    const heures = String(maintenant.getHours()).padStart(2, '0');
    const minutes = String(maintenant.getMinutes()).padStart(2, '0');
    const heureActuelle = `${heures}:${minutes}`;

    if (heureActuelle === savedTime) {
      const derniereNotif = localStorage.getItem('lastTriggeredMinute');
      if (derniereNotif !== heureActuelle) {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("90jrd de reconstruction ⏰", {
            body: "C'est l'heure de ton rappel personnalisé (" + savedTime + ") !"
          });
        }
        localStorage.setItem('lastTriggeredMinute', heureActuelle);
      }
    }
  }, 30000);
</script>
  
</html>
